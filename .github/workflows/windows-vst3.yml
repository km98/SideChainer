name: windows-vst3

# Builds the Windows x64 VST3 from this repository's source, compiles the Inno
# Setup installer, and proves the installer on a throwaway Windows machine:
# silent install -> payload hash vs the built artifact -> upgrade cleanup of our
# own legacy bundle -> foreign plug-in untouched -> silent uninstall.
#
# The products are published to a per-run results branch (committed rather than
# attached, so they can be fetched with plain git, without any extra token) and
# also offered as a workflow artifact. Nothing here publishes a customer download:
# distribution goes through the website once the upload credential and the host
# acceptance tests exist.
#
# Honest limits, recorded in RESULTS.md of every run: no Authenticode certificate
# is available, so the installer is UNSIGNED, and no DAW is installed on the
# runner, so FL Studio / Ableton Live acceptance stays NOT TESTED.
#
# Path handling: work directories live in $RUNNER_TEMP. Bash steps convert it with
# cygpath, PowerShell and cmd use it verbatim. No job-level env uses the `runner`
# context: that is not allowed there and silently fails the whole run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-vst3.yml'
      - 'SideChain/Builds/Windows/**'
      - 'SideChain/SideChain.jucer'
      - 'SideChain/Source/**'

permissions:
  contents: write

env:
  PRODUCT: PumpCurve
  VERSION: 0.4.1

jobs:
  windows-vst3:
    name: Windows x64 VST3 + installer
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      # The repository tracks release evidence with very deep paths (nested PKG
      # extractions), which exceed the Windows MAX_PATH limit and make a plain
      # checkout fail with "Filename too long". Long paths are enabled first, and
      # the checkout is restricted to what this build actually needs.
      - name: Allow long paths
        shell: bash
        run: |
          git config --system core.longpaths true || git config --global core.longpaths true
          git config --get core.longpaths

      - name: Checkout (sparse - source, jucer, Windows tooling)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/
            /SideChain/Builds/Windows/
            /SideChain/JuceLibraryCode/
            /SideChain/Resources/
            /SideChain/Source/
            /SideChain/SideChain.jucer
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # vswhere is authoritative about where Visual Studio lives on the image;
      # setup-msbuild does not reliably put MSBuild on PATH for bash steps.
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "vswhere not found"; exit 1 }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
                       -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { Write-Host "MSBuild.exe not found by vswhere"; exit 1 }
          Write-Host "MSBuild: $msbuild"
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Informational only: it must never be the reason a run stops.
      - name: Toolchain report
        shell: bash
        run: |
          set -u
          T="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$T/logs"
          {
            echo "runner:   $RUNNER_OS $RUNNER_ARCH ($RUNNER_NAME)"
            echo "python:   $(python --version 2>&1)"
            echo "git head: $(git rev-parse HEAD)"
            echo "git longpaths: $(git config --get core.longpaths || echo unset)"
            echo "msbuild:  ${MSBUILD_PATH:-<not located>}"
            echo "run:      $GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER"
            echo "temp:     $T"
            echo "files in the working tree: $(git ls-files | wc -l)"
          } | tee "$T/logs/toolchain.txt"
          "${MSBUILD_PATH:-msbuild}" -version 2>&1 | tail -3 | tee -a "$T/logs/toolchain.txt" || true
          exit 0

      - name: Validate the build inputs (self-tests)
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"; mkdir -p "$T/logs"
          cd SideChain/Builds/Windows
          python tools/stage_windows_vst3.py --self-test 2>&1 | tee "$T/logs/stage_self_test.log"
          python tools/build_windows_vst3.py --self-test 2>&1 | tee "$T/logs/rc_identity_self_test.log"
          python tools/build_windows_vst3.py --check 2>&1 | tee "$T/logs/build_check.log"

      # The project's module paths are relative to the .jucer file and expect the
      # JUCE tree next to the repository ("<repo>/../HISE/JUCE"), exactly as on the
      # Mac. The patched tree goes there so the generated Visual Studio project
      # resolves to it; the stock tree is only used to build Projucer.
      - name: Provision JUCE (patched product tree + stock Projucer tree)
        id: juce
        shell: bash
        run: |
          set -euo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"; mkdir -p "$T/logs"
          SIBLING="$(dirname "$(cygpath -u "$GITHUB_WORKSPACE")")/HISE/JUCE"
          echo "patched JUCE -> $(cygpath -m "$SIBLING")" | tee "$T/logs/juce_path.txt"
          cd SideChain/Builds/Windows/juce
          python verify_juce_tree.py --provision --dest "$SIBLING" 2>&1 | tee "$T/logs/juce_patched.log"
          python verify_juce_tree.py --extract-stock --dest "$T/juce-stock" 2>&1 | tee "$T/logs/juce_stock.log"

      - name: Build Projucer 6.1.3 (stock tree)
        id: projucer
        shell: bash
        run: |
          set -uo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          cd SideChain/Builds/Windows
          MSB=()
          [ -n "${MSBUILD_PATH:-}" ] && MSB=(--msbuild "$MSBUILD_PATH")
          python tools/build_windows_vst3.py --build-projucer --juce-root "$T/juce-stock" \
              "${MSB[@]}" 2>&1 | tee "$T/logs/projucer.log"

      - name: Build the PumpCurve VST3 (x64, patched JUCE)
        id: build
        shell: bash
        run: |
          set -uo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"; mkdir -p "$T/artifacts"
          SIBLING="$(dirname "$(cygpath -u "$GITHUB_WORKSPACE")")/HISE/JUCE"
          cd SideChain/Builds/Windows
          PJ="$(find "$T/juce-stock" -name Projucer.exe -type f | sort | tail -1)"
          echo "Projucer: $PJ"
          test -n "$PJ"
          MSB=()
          [ -n "${MSBUILD_PATH:-}" ] && MSB=(--msbuild "$MSBUILD_PATH")
          python tools/build_windows_vst3.py --build \
              --juce-root "$SIBLING" --projucer "$PJ" --out-dir "$T/artifacts" \
              "${MSB[@]}" 2>&1 | tee "$T/logs/build.log"

      - name: Install Inno Setup 6
        id: inno
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Build the installer
        id: installer
        shell: cmd
        run: |
          set PUMPCURVE_OUTDIR=%RUNNER_TEMP%\artifacts
          call SideChain\Builds\Windows\installer\build_installer.cmd %VERSION% "%RUNNER_TEMP%\artifacts\PumpCurve.vst3" > "%RUNNER_TEMP%\logs\installer.log" 2>&1
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\logs\installer.log"
          if not "%RC%"=="0" exit /b %RC%

      - name: Installer lifecycle test (install / upgrade / uninstall)
        id: lifecycle
        shell: pwsh
        run: |
          $art = "$env:RUNNER_TEMP\artifacts"
          $module = "$art\PumpCurve.vst3\Contents\x86_64-win\PumpCurve.vst3"
          if (-not (Test-Path $module)) { Write-Host "no staged module: cannot test the installer"; exit 1 }
          $sha = (Get-FileHash -Algorithm SHA256 -Path $module).Hash
          & "$PWD\SideChain\Builds\Windows\installer\test_install_uninstall.ps1" `
              -Setup "$art\PumpCurve-$($env:VERSION)-Windows-x64-Setup.exe" `
              -ExpectedModuleSha256 $sha `
              -StagedBundle "$art\PumpCurve.vst3" `
              -LogDir "$env:RUNNER_TEMP\logs\installer" 2>&1 |
            Tee-Object "$env:RUNNER_TEMP\logs\installer_lifecycle.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installed-state verifier control (positive and negative)
        id: verifier
        shell: pwsh
        run: |
          $art = "$env:RUNNER_TEMP\artifacts"
          $logs = "$env:RUNNER_TEMP\logs"
          $setup = "$art\PumpCurve-$($env:VERSION)-Windows-x64-Setup.exe"
          $module = "$art\PumpCurve.vst3\Contents\x86_64-win\PumpCurve.vst3"
          $sha = (Get-FileHash -Algorithm SHA256 -Path $module).Hash
          $verify = "$PWD\SideChain\Builds\Windows\installer\verify_install.ps1"
          $failed = 0

          Write-Host "== negative control: nothing is installed =="
          & powershell -ExecutionPolicy Bypass -File $verify | Tee-Object "$logs\verify_negative_1.log"
          if ($LASTEXITCODE -eq 0) { Write-Host "  FAIL: verifier passed with nothing installed"; $failed++ }

          Write-Host "== install, then verify against the built artifact hash =="
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$logs\install-for-verify.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "  FAIL: install exit $($p.ExitCode)"; $failed++ }
          & powershell -ExecutionPolicy Bypass -File $verify -Sha256 $sha | Tee-Object "$logs\verify_positive.log"
          if ($LASTEXITCODE -ne 0) { Write-Host "  FAIL: verifier rejected a correct installation"; $failed++ }

          Write-Host "== uninstall, then verify the machine is clean again =="
          $un = "$env:CommonProgramFiles\$env:PRODUCT\unins000.exe"
          if (Test-Path $un) {
            $p = Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Host "  FAIL: uninstall exit $($p.ExitCode)"; $failed++ }
          } else { Write-Host "  FAIL: no uninstaller at $un"; $failed++ }
          & powershell -ExecutionPolicy Bypass -File $verify | Tee-Object "$logs\verify_negative_2.log"
          if ($LASTEXITCODE -eq 0) { Write-Host "  FAIL: verifier passed after uninstall"; $failed++ }

          if ($failed -ne 0) { Write-Host "VERIFIER CONTROL: FAIL ($failed)"; exit 1 }
          Write-Host "VERIFIER CONTROL: PASS"

      - name: Record signature state
        id: signature
        if: always()
        shell: pwsh
        run: |
          $art = "$env:RUNNER_TEMP\artifacts"
          $logs = "$env:RUNNER_TEMP\logs"
          $setup = "$art\PumpCurve-$($env:VERSION)-Windows-x64-Setup.exe"
          "signature state (NotSigned is expected: no Authenticode certificate in this pipeline)" |
            Tee-Object "$logs\signature.txt"
          if (Test-Path $setup) {
            $sig = Get-AuthenticodeSignature $setup
            "Setup.exe: $($sig.Status) - $($sig.StatusMessage)" | Tee-Object -Append "$logs\signature.txt"
          } else { "Setup.exe: missing" | Tee-Object -Append "$logs\signature.txt" }

      - name: Collect results, hashes and an honest summary
        if: always()
        shell: pwsh
        run: |
          $art = "$env:RUNNER_TEMP\artifacts"
          $logs = "$env:RUNNER_TEMP\logs"
          $res = "$env:RUNNER_TEMP\results"
          New-Item -ItemType Directory -Force "$res\artifacts" | Out-Null
          New-Item -ItemType Directory -Force "$res\logs" | Out-Null
          if (Test-Path $art)  { Copy-Item "$art\*"  "$res\artifacts\" -Recurse -Force }
          if (Test-Path $logs) { Copy-Item "$logs\*" "$res\logs\"      -Recurse -Force }

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("# PumpCurve $($env:VERSION) - Windows x64 build result")
          $lines.Add("")
          $lines.Add("| item | value |")
          $lines.Add("|---|---|")
          $lines.Add("| repository | $env:GITHUB_REPOSITORY |")
          $lines.Add("| source revision | $env:GITHUB_SHA |")
          $lines.Add("| workflow run | $env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT) |")
          $lines.Add("| runner | $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageOS) |")
          $lines.Add("| signed | no - unsigned installer, no Authenticode certificate in this pipeline |")
          $lines.Add("| step: validate  | ${{ steps.validate.outcome }} |")
          $lines.Add("| step: juce      | ${{ steps.juce.outcome }} |")
          $lines.Add("| step: projucer  | ${{ steps.projucer.outcome }} |")
          $lines.Add("| step: build     | ${{ steps.build.outcome }} |")
          $lines.Add("| step: inno      | ${{ steps.inno.outcome }} |")
          $lines.Add("| step: installer | ${{ steps.installer.outcome }} |")
          $lines.Add("| step: lifecycle | ${{ steps.lifecycle.outcome }} |")
          $lines.Add("| step: verifier  | ${{ steps.verifier.outcome }} |")
          $lines.Add("")
          $lines.Add("## Artifact hashes (SHA-256)")
          $lines.Add("")
          $lines.Add("````")
          Get-ChildItem "$res\artifacts" -Recurse -File | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLower()
            $rel = $_.FullName.Substring("$res\artifacts".Length + 1)
            $lines.Add(("{0}  {1}" -f $h, $rel))
          }
          $lines.Add("````")
          $lines.Add("")
          $lines.Add("## Not verified by this run (do not read it as a release)")
          $lines.Add("")
          $lines.Add("- **Code signing: NOT SIGNED.** No Authenticode certificate exists;")
          $lines.Add("  SmartScreen will warn until the installer is signed.")
          $lines.Add("- **DAW acceptance: NOT TESTED.** No DAW runs on the runner, so FL Studio")
          $lines.Add("  and Ableton Live insertion and operation are unverified.")
          $lines.Add("- **Distribution: NOT PUBLISHED.** The website upload credential is not")
          $lines.Add("  available, so no customer download serves this build yet.")
          ($lines -join "`n") | Set-Content "$res\RESULTS.md" -Encoding utf8
          Get-Content "$res\RESULTS.md"

      - name: Upload results as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpcurve-windows-${{ github.sha }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 14

      - name: Publish results to a per-run branch
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          T="$(cygpath -u "$RUNNER_TEMP")"
          RESULTS="$T/results"
          if [ ! -d "$RESULTS" ]; then echo "no results directory; nothing to publish"; exit 0; fi
          BRANCH="windows-build-results/${GITHUB_SHA:0:7}-r${GITHUB_RUN_NUMBER}"
          cd "$RESULTS"
          git init -q .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -q -m "PumpCurve $VERSION Windows x64 build result for $GITHUB_SHA (run $GITHUB_RUN_NUMBER)"
          git push --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/${BRANCH}"
          echo "published branch: ${BRANCH}"
